<div id="deng">
<style>
#deng{font-family:Inter,system-ui,sans-serif;color:#0F172A;max-width:760px;margin:auto}
#deng .kutu{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#deng .ust{display:flex;gap:6px;background:#F1F0FD}
#deng .sekme{flex:1;padding:12px;border:0;background:none;font:inherit;font-weight:600;color:#475569;cursor:pointer}
#deng .sekme.aktif{background:#fff;color:#5B4BDB}
#deng .panel{display:none;padding:14px}#deng .panel.aktif{display:block}
#deng #mesajlar{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
#deng .m{max-width:85%;padding:9px 13px;border-radius:12px;line-height:1.5;white-space:pre-wrap;font-size:14px}
#deng .ai{background:#F1F0FD;align-self:flex-start}#deng .ben{background:#5B4BDB;color:#fff;align-self:flex-end}
#deng form{display:flex;gap:8px;margin-top:10px}#deng form.demo{display:grid}
#deng input,#deng select,#deng textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:10px;width:100%;box-sizing:border-box}
#deng button.gonder{font:inherit;background:#5B4BDB;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
#deng .not{font-size:12px;color:#64748b;margin:0}
</style>
<div class="kutu">
  <div class="ust">
    <button class="sekme aktif" data-p="p-sohbet">Yapay zeka danışmanı</button>
    <button class="sekme" data-p="p-demo">Demo talep et</button>
  </div>
  <div class="panel aktif" id="p-sohbet">
    <div id="mesajlar"><div class="m ai">Merhaba, ben DENG-AI'ın yapay zeka danışmanıyım. Ekibiniz kaç kişi ve en çok hangi konuda zorlanıyorsunuz?</div></div>
    <form id="sohbet"><input id="girdi" placeholder="Mesajınızı yazın..." autocomplete="off"><button class="gonder">Gönder</button></form>
  </div>
  <div class="panel" id="p-demo">
    <form class="demo" id="demo">
      <input name="isim" placeholder="Ad Soyad *" required>
      <input name="telefon" placeholder="Telefon *" required>
      <input name="sirket" placeholder="Şirket adı *" required>
      <select name="ekip_buyuklugu" required><option value="">Ekip büyüklüğü *</option><option>1-10</option><option>11-50</option><option>51-200</option><option>200+</option></select>
      <input name="eposta" type="email" placeholder="E-posta">
      <textarea name="mesaj" rows="2" placeholder="Mesajınız"></textarea>
      <p class="not">Bu formda paylaştığınız bilgiler demo talebinizi yanıtlamak amacıyla işlenir.</p>
      <button class="gonder">Gönder</button><div id="sonuc"></div>
    </form>
  </div>
</div>
<script>
const API = "https://deng-ai.onrender.com";
let gecmis = [];

document.querySelectorAll("#deng .sekme").forEach(function (sekme) {
  sekme.addEventListener("click", function () {
    document.querySelectorAll("#deng .sekme, #deng .panel").forEach(function (e) { e.classList.remove("aktif"); });
    sekme.classList.add("aktif");
    document.getElementById(sekme.dataset.p).classList.add("aktif");
  });
});

function mesajEkle(metin, kimden) {
  let balon = document.createElement("div");
  balon.className = "m " + kimden;
  balon.textContent = metin;
  let kutu = document.getElementById("mesajlar");
  kutu.appendChild(balon);
  kutu.scrollTop = kutu.scrollHeight;
  return balon;
}

document.getElementById("sohbet").addEventListener("submit", async function (olay) {
  olay.preventDefault();
  let girdi = document.getElementById("girdi");
  let mesaj = girdi.value.trim();
  if (mesaj === "") return;
  girdi.value = "";
  mesajEkle(mesaj, "ben");
  let balon = mesajEkle("...", "ai");
  try {
    let yanit = await fetch(API + "/api/sohbet", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mesaj: mesaj, gecmis: gecmis })
    });
    let veri = await yanit.json();
    if (veri.basari) {
      balon.textContent = veri.cevap;
      gecmis.push({ role: "user", content: mesaj });
      gecmis.push({ role: "assistant", content: veri.cevap });
    } else {
      balon.textContent = veri.hata;
    }
  } catch (hata) {
    balon.textContent = "Bağlantı hatası, lütfen tekrar deneyin.";
  }
});

document.getElementById("demo").addEventListener("submit", async function (olay) {
  olay.preventDefault();
  let form = olay.target;
  let sonuc = document.getElementById("sonuc");
  let veri = {
    isim: form.isim.value, telefon: form.telefon.value, sirket: form.sirket.value,
    ekip_buyuklugu: form.ekip_buyuklugu.value, eposta: form.eposta.value, mesaj: form.mesaj.value
  };
  try {
    let yanit = await fetch(API + "/api/leads", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(veri)
    });
    let cevap = await yanit.json();
    sonuc.textContent = cevap.basari ? cevap.mesaj : cevap.hata;
    sonuc.style.color = cevap.basari ? "#0F766E" : "#b91c1c";
    if (cevap.basari) form.reset();
  } catch (hata) {
    sonuc.textContent = "Bağlantı hatası.";
  }
});
</script>
</div>
