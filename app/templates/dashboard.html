<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENG-AI | Yönetim Paneli</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F8FAFC;color:#0F172A}
header{background:#1E1B4B;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header a{color:#cbd5e1;text-decoration:none;font-size:14px}
main{max-width:1100px;margin:auto;padding:24px}
.ozet{display:flex;gap:12px;margin-bottom:18px}.kart{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px}
.kart b{display:block;font-size:26px;color:#5B4BDB}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#F1F0FD}
.bos{padding:30px;text-align:center;color:#64748b}
</style></head><body>
<header><strong>DENG-AI · Demo Talepleri</strong><a href="/">Siteye dön</a></header>
<main><div class="ozet"><div class="kart"><b id="toplam">0</b>Toplam talep</div><div class="kart"><b id="buyuk">0</b>51+ kişilik ekip</div></div>
<table><thead><tr><th>Tarih</th><th>Ad Soyad</th><th>Telefon</th><th>Şirket</th><th>Ekip</th><th>E-posta</th><th>Mesaj</th></tr></thead><tbody id="liste"></tbody></table>
<div id="bos" class="bos" hidden>Henüz demo talebi yok.</div></main>
<script>
fetch("/api/leads")
  .then(function (yanit) { return yanit.json(); })
  .then(function (veri) {
    let leadler = veri.leadler || [];

    document.getElementById("toplam").textContent = leadler.length;
    let buyukEkip = 0;
    for (let lead of leadler) {
      if (lead.ekip_buyuklugu === "51-200" || lead.ekip_buyuklugu === "200+") {
        buyukEkip = buyukEkip + 1;
      }
    }
    document.getElementById("buyuk").textContent = buyukEkip;

    if (leadler.length === 0) {
      document.getElementById("bos").hidden = false;
      return;
    }

    let tablo = document.getElementById("liste");
    for (let lead of leadler) {
      let satir = document.createElement("tr");
      let degerler = [lead.tarih, lead.isim, lead.telefon, lead.sirket, lead.ekip_buyuklugu, lead.eposta || "", lead.mesaj || ""];
      for (let deger of degerler) {
        let hucre = document.createElement("td");
        hucre.textContent = deger;
        satir.appendChild(hucre);
      }
      tablo.appendChild(satir);
    }
  });
</script></body></html>
